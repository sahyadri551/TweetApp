{% extends "layout.html" %}
{% block title %}
Delete Tweet
{% endblock %}
{% block content %}

<section class="max-w-xl mx-auto px-6 py-12">
<div class="bg-white rounded-2xl shadow-sm border border-red-200 p-8">
    <h1 class="text-2xl font-bold text-red-600 mb-4">
        Delete Tweet
    </h1>
    <p class="text-slate-600 mb-6">
        Are you sure you want to delete this tweet?
    </p>
    <div class="bg-slate-100 rounded-xl p-4 mb-6">
        {{ tweet.text }}
    </div>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-5 py-3 rounded-xl hover:bg-red-700">
            Delete
        </button>
        <a href="{% url 'home' %}" class="ml-3 px-5 py-3 rounded-xl border border-slate-300">
            Cancel
        </a>

    </form>
</div>
</section>

{% endblock %}
