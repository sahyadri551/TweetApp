{% extends "layout.html" %}

{% block title %}
{{ heading|default:"Create Tweet" }}
{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-6 py-12">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <h1 class="text-3xl font-bold mb-6">
            {{ heading|default:"Create Tweet" }}
        </h1>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.text }}
                {{ form.image }}
            </div>
            <button type="submit" class="mt-5 bg-black text-white px-6 py-3 rounded-xl hover:bg-slate-800 transition">
                Save Tweet
            </button>
        </form>
    </div>
</section>

{% endblock %}
