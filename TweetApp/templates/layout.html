{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            Tweet App
        {% endblock %}
    </title>
    {% tailwind_css %}
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>

<body class="bg-slate-300 text-blue-800 min-h-screen">
<header class="border-b border-slate-200 bg-white sticky top-0 z-50">
<nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="{% url 'home' %}" class="font-bold text-xl">
        TweetApp
    </a>

    <div class="flex items-center gap-4">

        {% if request.user.is_authenticated %}

            <a
                href="{% url 'tweet_create' %}"
                class="text-slate-600 hover:text-black"
            >
                Create
            </a>

            <a
                href="{% url 'profile' %}"
                class="text-slate-600 hover:text-black"
            >
                Profile
            </a>
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="bg-black text-white px-4 py-2 rounded-lg">
                    Logout
                </button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="text-slate-600 hover:text-black">
                Login
            </a>

            <a href="{% url 'register' %}" class="bg-black text-white px-4 py-2 rounded-lg">
                Register
            </a>
        {% endif %}

    </div>

</nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
