{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-12">
<div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
    <h1 class="text-3xl font-bold mb-2">
        Welcome Back
    </h1>
    <p class="text-slate-500 mb-6">
        Sign in to continue.
    </p>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block mb-1 font-medium" for = "username">
                Username
            </label>
            {{ form.username }}
        </div>
        <div>
            <label class="block mb-1 font-medium" for = "password">
                Password
            </label>
            {{ form.password }}
        </div>
        <button type="submit" class="w-full bg-black text-white py-3 rounded-xl hover:bg-slate-800">
            Login
        </button>

    </form>

    <p class="mt-6 text-sm text-center text-slate-500">
        Don't have an account?
        <a href="{% url 'register' %}" class="text-blue-600">
            Register
        </a>
    </p>

</div>

{% endblock %}
