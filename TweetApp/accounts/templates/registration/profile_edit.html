{% extends "layout.html" %}
{% block title %}
Edit Profile
{% endblock %}
{% block content %}
<section class="max-w-3xl mx-auto py-10">
<div class="bg-white rounded-2xl border border-slate-200 p-8">
    <h1 class="text-3xl font-bold mb-6">
        Edit Profile
    </h1>
    <form
        method="POST"
        enctype="multipart/form-data"
        class="space-y-4"
    >
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-black text-white px-5 py-3 rounded-lg">
            Save Changes
        </button>
    </form>
</div>
</section>

{% endblock %}
